spring.application.name=SalesSavvy
server.port=${PORT:9091}

spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/salessavvy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.createDatabaseIfNotExist=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

jwt.secret=super-very-long-and-secure-secret-key-minimum-64-characters-1234567890abcdef1234567890abcdef1234567890
jwt.expiration=3600000

spring.mail.host=smtp.gmail.com
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:20000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:20000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITETIMEOUT:20000}
spring.mail.default-encoding=UTF-8

# SMTP configuration is hardcoded here per user request.
app.backend.base-url=${APP_BACKEND_BASE_URL:http://localhost:9091}

