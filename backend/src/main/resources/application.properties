spring.application.name=SalesSavvy
server.port=${PORT:9090}

spring.datasource.url=${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/salessavvy?useSSL=false&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true}}
spring.datasource.username=${JDBC_DATABASE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.data-source-properties.createDatabaseIfNotExist=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

jwt.secret=super-very-long-and-secure-secret-key-minimum-64-characters-1234567890abcdef1234567890abcdef1234567890
jwt.expiration=3600000

