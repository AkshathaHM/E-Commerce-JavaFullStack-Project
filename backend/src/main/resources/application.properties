spring.application.name=SalesSavvy

server.port=9090

spring.datasource.url=jdbc:mysql://localhost:3306/salessavy
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Disable security auto-config to avoid 401 errors (BCrypt still available manually)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
# JWT Configuration (required for AuthService)
jwt.secret=your-very-long-secure-secret-key-for-production-12345678901234567890
jwt.expiration=3600000